# Railway service config for the backend. Set this service's Root Directory
# to `backend/` when creating it (monorepo — see root DEPLOYMENT.md).
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
