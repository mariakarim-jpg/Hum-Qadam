name: Trigger morning check-in

# FR-02 / plan/13: 4:50am PKT, Mon-Fri. GitHub Actions cron is always UTC and
# doesn't support timezones, so this is hand-converted: PKT = UTC+5 (fixed,
# no DST), so 4:50am PKT is 23:50 UTC the *previous* day. That shifts the
# weekday back by one too — PKT Mon-Fri (1-5) becomes UTC Sun-Thu (0-4).
# If this ever looks off, re-derive it rather than guess: subtract 5 hours
# from the PKT time, and if that crosses midnight, subtract one weekday too.
#
# GitHub Actions schedules aren't guaranteed to the minute — expect it to
# fire a few minutes late during high load. Acceptable for a morning
# check-in; not acceptable if this pattern is reused for something
# time-critical.
on:
  schedule:
    - cron: '50 23 * * 0-4'
  workflow_dispatch: {} # manual "Run workflow" button, for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/jobs/morning-checkin
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/internal/jobs/morning-checkin" \
            -H "X-Job-Secret: ${{ secrets.JOB_TRIGGER_SECRET }}" \
            --max-time 90
